name: Verify research record
on:
  push:
    branches: [main, 'initialize/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip
      - name: Install recorded scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Check repository infrastructure
        run: python checks/test_repository.py
      - name: Verify all preserved suites and source integrity
        run: python verify.py --output-dir verification-artifacts
      - name: Reject source rewrites
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
      - name: Upload exact source and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-artifacts/
          if-no-files-found: warn
          retention-days: 30
